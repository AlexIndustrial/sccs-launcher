name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher-win:
    name: launcher (win x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Тег vX.Y.Z — источник правды для версии: подставляем её в package.json,
      # чтобы имя артефакта (sccs-launcher-X.Y.Z-setup.exe) совпадало с тегом.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$version"
          node -e "console.log('version: ' + require('./package.json').version)"

      - name: Build installer
        run: pnpm run build:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sccs-launcher-win-x64
          path: dist/sccs-launcher-*-setup.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          # latest.yml обязателен: без него electron-updater не видит обновлений.
          files: |
            dist/sccs-launcher-*-setup.exe
            dist/latest.yml
            dist/*.blockmap
